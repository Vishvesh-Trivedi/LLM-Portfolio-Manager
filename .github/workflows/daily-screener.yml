name: Daily Stock Screener

# Runs the LLM portfolio screener once per day.
# The Python script itself self-skips US weekends and NYSE public holidays
# (it exits early with a "market closed" message), so a plain daily cron is safe.

on:
  schedule:
    # 21:15 UTC every day = ~4:15-5:15 PM US Eastern (after the market close),
    # which lands a little earlier in the NZ morning. The script decides whether it's a trading day.
    - cron: '15 21 * * *'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never let two runs overlap (portfolio state is committed back to the repo).
concurrency:
  group: daily-screener
  cancel-in-progress: false

permissions:
  contents: write   # required to commit the updated portfolio/config state back

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        env:
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run screener
        env:
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          WHATSAPP_PHONE:    ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          PYTHONUNBUFFERED:   '1'
        run: python -u LLM_Portfolio_Manager.py

      - name: Commit updated portfolio state
        if: always()   # persist state even if the screen step failed part-way
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A StockScreener || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update portfolio state [skip ci] ($(date -u +'%Y-%m-%d'))"
            git push
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: |
            StockScreener/*.html
            StockScreener/*.csv
            StockScreener/*.json
          if-no-files-found: ignore
          retention-days: 14
