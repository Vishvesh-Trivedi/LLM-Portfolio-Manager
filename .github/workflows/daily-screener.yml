name: Daily Stock Screener

on:
  schedule:
    # GitHub does not run these when they say. Measured over three weeks, the
    # 20:30 entry has never started before 22:21 UTC, the median start is
    # 23:15, the worst was 23:51 - and on 2026-09-18 the schedule was dropped
    # altogether and the session went unprocessed. A single pair of entries
    # makes the day's run depend on whether GitHub feels busy.
    #
    # So the window is covered rather than aimed at. The first attempt that
    # actually lands processes the session; every later one finds the date in
    # processed_sessions and exits as "already processed" within seconds. The
    # concurrency group below stops two from overlapping. Extra entries
    # therefore cost almost nothing and remove the single point of failure.
    #
    # The six evening entries all land on the same New York session date:
    # 01:11 UTC is 21:11 ET on the same weekday. The earliest fall before the
    # 16:15 ET gate in winter, where they now finish the previous session
    # rather than doing nothing.
    # Deliberately odd minutes. Every one of these used to be :30, which after
    # :00 is the minute most of GitHub asks for - and a scheduled job waits
    # behind everything else queued at the same instant. Asking at a time few
    # others do is the one part of the delay that is ours to influence.
    - cron: '17 20 * * *'   # 16:17 ET in summer / 15:17 ET in winter
    - cron: '23 21 * * *'   # 17:23 ET in summer / 16:23 ET in winter
    - cron: '41 22 * * *'   # around the earliest start actually observed
    - cron: '07 23 * * *'   # around the median start
    - cron: '53 0 * * *'    # past the worst start observed
    - cron: '11 1 * * *'    # last chance that evening
    #
    # Morning entries, which exist because the evening ones are not reliable.
    # Measured over the nine days to 2026-09-28 the scheduler's median delay is
    # 48 minutes and its 90th percentile is five hours; on 2026-09-25 the 01:11
    # entry was delivered at 05:30 and again at 06:09. Until now the only cover
    # for a dropped evening was another evening entry drifting into the small
    # hours by accident.
    #
    # A run here finishes the previous session rather than the current one, and
    # costs the strategy nothing: all three land before the opening bell in both
    # daylight regimes, so the order still queues for the same open it would
    # have queued for had the evening run placed it. Anything that finds the
    # session already processed exits within seconds.
    - cron: '13 9 * * *'    # 05:13 ET in summer / 04:13 ET in winter
    - cron: '47 10 * * *'   # 06:47 ET / 05:47 ET
    - cron: '29 12 * * *'   # 08:29 ET / 07:29 ET - last one still pre-open
  workflow_dispatch:
    inputs:
      qa_only:
        description: 'Isolated QA: test real providers without changing portfolio or sending alerts'
        type: boolean
        default: false
      force_session:
        description: 'Allow a manual rerun for the current US session even if it was already processed'
        type: boolean
        default: false
      preflight_only:
        description: 'Only check that the secrets, Alpaca, LLM and Discord are wired, then stop'
        type: boolean
        default: false
      strategy_explainer:
        description: 'Only post the plain-English explanation of the strategy to Discord, then stop'
        type: boolean
        default: false

concurrency:
  group: daily-screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        id: tests
        env:
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Isolated live QA
        if: ${{ inputs.qa_only == true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-qa
          PYTHONUNBUFFERED: '1'
        run: python qa_validate.py --live
      - name: Post the strategy explainer to Discord
        if: ${{ inputs.strategy_explainer == true }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-explainer
          PYTHONUNBUFFERED: '1'
        run: python -u explain_strategy.py --send

      - name: Preflight readiness check
        id: preflight
        if: ${{ inputs.qa_only != true && inputs.strategy_explainer != true }}
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCREENER_LIVE_BROKER: ${{ secrets.SCREENER_LIVE_BROKER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-preflight
          PYTHONUNBUFFERED: '1'
        run: python -u qa_validate.py --preflight

      - name: Run screener
        id: screener
        if: ${{ inputs.qa_only != true && inputs.preflight_only != true && inputs.strategy_explainer != true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          SCREENER_LIVE_BROKER: ${{ secrets.SCREENER_LIVE_BROKER }}
          SCREENER_FORCE_SESSION: ${{ github.event_name == 'workflow_dispatch' || inputs.force_session == true }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -u LLM_Portfolio_Manager.py 2>&1 | tee ${{ runner.temp }}/screener.log

      - name: Publish a redacted console log
        if: ${{ always() && inputs.qa_only != true && inputs.preflight_only != true && inputs.strategy_explainer != true }}
        run: |
          python qa_validate.py --redact-log \
            ${{ runner.temp }}/screener.log StockScreener/last_run.log
      - name: Commit validated portfolio state
        if: ${{ always() && inputs.qa_only != true && inputs.preflight_only != true && inputs.strategy_explainer != true && steps.tests.outcome == 'success' && steps.screener.outcome != 'skipped' }}
        env:
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/state-validation
        run: |
          # Check the ledger's arithmetic, but commit either way. A ledger whose
          # numbers contradict each other is exactly the state worth preserving
          # - blocking the commit would discard the run's ledger, health and
          # console log, which are what make it diagnosable. Record the verdict
          # and fail the step at the end instead.
          if python qa_validate.py --check-state StockScreener/portfolio.json; then
            LEDGER_OK=1
          else
            LEDGER_OK=0
            echo "::error title=Ledger arithmetic is inconsistent::See the check-state output above; the state is still committed so it can be inspected."
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- StockScreener
          if ! git diff --cached --quiet; then
            git commit -m "chore: update validated paper portfolio [skip ci] ($(date -u +'%Y-%m-%d'))"
            # A push that lands while this run was working is rejected as
            # non-fast-forward, and the run's ledger, health report and console
            # log are lost with it - which is exactly how run 101's results
            # were thrown away. Rebase onto whatever arrived and try again.
            # Only StockScreener/ is touched here, so a rebase cannot conflict
            # with code changes; retry a few times in case of another push.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $attempt); rebasing onto origin/main"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            done
            echo "could not publish run state after 3 attempts" >&2
            exit 1
          fi
          [ "$LEDGER_OK" = "1" ] || exit 1
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screener-output
          path: |
            StockScreener/*.html
            StockScreener/*.csv
            StockScreener/*.json
            ${{ runner.temp }}/screener-qa/*.json
            ${{ runner.temp }}/screener-qa/*.html
          if-no-files-found: warn
          retention-days: 30