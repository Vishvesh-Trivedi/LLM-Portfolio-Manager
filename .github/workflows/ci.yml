name: Offline regression tests

on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      SCREENER_SKIP_UNIVERSE_FETCH: '1'
      SCREENER_DISABLE_ALERTS: '1'
      SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q LLM_Portfolio_Manager.py screener_safety.py screener_portfolio.py screener_contracts.py qa_validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate committed legacy ledger without mutation
        run: python qa_validate.py --check-state StockScreener/portfolio.json