name: Daily Stock Screener

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      qa_only:
        description: 'Isolated QA: test real providers without changing portfolio or sending alerts'
        type: boolean
        default: false

concurrency:
  group: daily-screener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        id: tests
        env:
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Isolated live QA
        if: ${{ inputs.qa_only == true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/screener-qa
          PYTHONUNBUFFERED: '1'
        run: python qa_validate.py --live
      - name: Run screener
        id: screener
        if: ${{ inputs.qa_only != true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCREENER_LIVE_BROKER: ${{ secrets.SCREENER_LIVE_BROKER }}
          PYTHONUNBUFFERED: '1'
        run: python -u LLM_Portfolio_Manager.py
      - name: Commit validated portfolio state
        if: ${{ always() && inputs.qa_only != true && steps.tests.outcome == 'success' && steps.screener.outcome != 'skipped' }}
        env:
          SCREENER_SKIP_UNIVERSE_FETCH: '1'
          SCREENER_DISABLE_ALERTS: '1'
          SCREENER_OUTPUT_DIR: ${{ runner.temp }}/state-validation
        run: |
          python qa_validate.py --check-state StockScreener/portfolio.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- StockScreener
          if ! git diff --cached --quiet; then
            git commit -m "chore: update validated paper portfolio [skip ci] ($(date -u +'%Y-%m-%d'))"
            git push
          fi
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screener-output
          path: |
            StockScreener/*.html
            StockScreener/*.csv
            StockScreener/*.json
            ${{ runner.temp }}/screener-qa/*.json
            ${{ runner.temp }}/screener-qa/*.html
          if-no-files-found: warn
          retention-days: 30